<title>JointGlow Joint Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: charcoal brand bar + SOAP stepper; working column on the left, clinician copilot rail on the right; the patient report renders as a light paper sheet. */
:root{
  --bg:#f5f5f5; --surface:#ffffff; --surface-2:#faf7f0; --ink:#373535; --ink-2:#4b494b; --muted:#767575; --line:#e6e2da;
  --gold:#ddb529; --gold-light:#edda5a; --gold-deep:#de9c2e; --gold-ink:#8a6d0b; --gold-tint:#fbf3e4;
  --bar:#373535; --on-bar:#ffffff;
  --ok:#4f8f6f; --mild:#c39a16; --mod:#d9772b; --sev:#c2452f; --urgent-bg:#fdecea; --urgent-ink:#9b2c1d;
  --bone:#efe5cf; --bone-line:#8d8270; --cart:#7fb6c9; --syn:#f2d9a6; --muscle:#d9a698; --lig:#8b6f5a;
  --zone-ok:#4f8f6f; --zone-mid:#ddb529; --zone-bad:#c2452f;
  --tx-none:#8f8a85; --tx-nsaid:#6d84ab; --tx-steroid:#b0588a; --tx-pt:#3f8a68; --tx-prp:#8466bd; --tx-ldrt:#de9c2e; --tx-stem:#3e9aa5; --tx-tka:#5b5757;
  --font:Poppins,"Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px #0000000d,0 4px 14px -6px #0000001f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1b1b; --surface:#262525; --surface-2:#2d2b28; --ink:#f3f0ea; --ink-2:#d8d4cd; --muted:#a39f99; --line:#3b3936;
  --gold-ink:#e9c84f; --gold-tint:#3a3222; --bar:#121111; --on-bar:#ffffff;
  --ok:#6fb08f; --mild:#d9b23a; --mod:#e88e45; --sev:#e2664f; --urgent-bg:#3d2320; --urgent-ink:#ffb4a6;
  --bone:#5a5346; --bone-line:#c9bda5; --cart:#5f9fb5; --syn:#6d5a33; --muscle:#8a5a4f; --lig:#c2a48c;
  --tx-none:#a39f99; --tx-nsaid:#8ea4cc; --tx-steroid:#d77fb0; --tx-pt:#64b08c; --tx-prp:#a68ce0; --tx-ldrt:#f0b245; --tx-stem:#62bcc6; --tx-tka:#bdb8b2;
  --shadow:0 1px 2px #0000004d,0 6px 18px -8px #00000080; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1c1b1b; --surface:#262525; --surface-2:#2d2b28; --ink:#f3f0ea; --ink-2:#d8d4cd; --muted:#a39f99; --line:#3b3936;
  --gold-ink:#e9c84f; --gold-tint:#3a3222; --bar:#121111; --on-bar:#ffffff;
  --ok:#6fb08f; --mild:#d9b23a; --mod:#e88e45; --sev:#e2664f; --urgent-bg:#3d2320; --urgent-ink:#ffb4a6;
  --bone:#5a5346; --bone-line:#c9bda5; --cart:#5f9fb5; --syn:#6d5a33; --muscle:#8a5a4f; --lig:#c2a48c;
  --tx-none:#a39f99; --tx-nsaid:#8ea4cc; --tx-steroid:#d77fb0; --tx-pt:#64b08c; --tx-prp:#a68ce0; --tx-ldrt:#f0b245; --tx-stem:#62bcc6; --tx-tka:#bdb8b2;
  --shadow:0 1px 2px #0000004d,0 6px 18px -8px #00000080; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.82em}

/* Brand bar */
.bar{background:var(--bar);color:var(--on-bar);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.bar img{height:38px;width:auto;display:block}
.bar .app{display:flex;flex-direction:column;line-height:1.15}
.bar .app b{font-size:17px;font-weight:700;letter-spacing:.01em}
.bar .app span{font-size:12px;color:#ffffffa6}
.bar .pt{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar label{font-size:12px;color:#ffffffb3}
.bar select{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 10px;max-width:100%}
.bar select option{color:#373535}
.glow{height:4px;background:linear-gradient(90deg,var(--gold-light),var(--gold-deep))}

/* SOAP stepper */
.steps{display:flex;gap:4px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.steps button{border:0;background:none;padding:12px 12px 10px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.steps button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.steps .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--ink)}
.steps button[aria-current="page"] .l{background:var(--gold);border-color:var(--gold);color:#373535}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 16px 40px;max-width:1440px;margin:0 auto}
@media (max-width:1040px){.layout{grid-template-columns:minmax(0,1fr)}}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card>h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card>.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
.pagehead h1{font-size:24px;font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.badge{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:8px;background:var(--bar);color:#fff;font-weight:800;font-size:15px}
.badge.gold{background:var(--gold);color:#373535}

/* Fields */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
.f>.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.f>.lab small{font-weight:400;color:var(--muted)}
.f input[type=text],.f input[type=number],.f select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
.f input:focus,.f select:focus{border-color:var(--gold)}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--gold-tint);border-color:var(--gold);color:var(--ink);font-weight:600}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--gold-deep)}
.range output{min-width:52px;text-align:right;font-weight:700}
.opq{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.opq:first-of-type{border-top:0;padding-top:4px}
.opq .big{width:44px;height:44px;border-radius:10px;background:var(--bar);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.opq h3{font-size:15px;font-weight:700;margin-bottom:2px}
.opq .why{font-size:12.5px;color:var(--muted);margin:0 0 10px}

/* Buttons */
.btn{border:2px solid transparent;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn.primary{color:#373535;background-image:linear-gradient(90deg,var(--gold-light) 0%,var(--gold-deep) 50%,var(--gold-light) 100%);background-size:200% auto;transition:background-position .4s}
.btn.primary:hover{background-position:right center}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.next{display:flex;justify-content:flex-end;gap:8px}

/* Assessment */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1}
.kpi .v small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--bar);border-color:var(--bar);color:#fff}
.kpi.hero .k{color:#ffffffb3}.kpi.hero .v small{color:#ffffffb3}
.kpi.hero .v{background:linear-gradient(90deg,var(--gold-light),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.flag{border-radius:var(--r);padding:12px 14px;background:var(--urgent-bg);color:var(--urgent-ink);display:flex;gap:10px;align-items:flex-start;font-size:14px}
.flag b{display:block}
.knees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.knee{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.knee svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.knee .cap{font-size:13px;font-weight:700;margin-top:4px}
.knee .cap small{display:block;font-weight:400;color:var(--muted)}
.areas{display:flex;flex-direction:column;gap:10px}
.area{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.area:first-child{border-top:0}
.area .dot{width:14px;height:14px;border-radius:4px;margin-top:3px}
.area b{font-size:14px}
.area p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.area .tr{font-size:12.5px;color:var(--muted);margin-top:4px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;max-width:260px}
.meter i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.ddx{width:100%;border-collapse:collapse;font-size:13.5px}
.ddx th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ddx td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ddx .let{font-weight:800;font-size:16px;width:30px}
.ddx .clue{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* Plan */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.opt.on{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.opt header{display:flex;align-items:center;gap:8px;justify-content:space-between}
.opt h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.opt h3 i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.opt p{margin:0;font-size:13px;color:var(--ink-2)}
.opt dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12.5px}
.opt dt{color:var(--muted)}.opt dd{margin:0}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--line)}
.fx .up{border-color:var(--ok);color:var(--ok)}.fx .dn{border-color:var(--sev);color:var(--sev)}
.warn{font-size:12.5px;color:var(--urgent-ink);background:var(--urgent-bg);border-radius:6px;padding:6px 8px}
details summary{cursor:pointer;font-size:12.5px;color:var(--gold-ink);font-weight:600}
details p{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.chart svg{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{white-space:normal;font-weight:600}
.tbl .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.plan li.off{opacity:.5}
.plan li.off .n{background:var(--line);color:var(--muted)}
.plan .n{width:28px;height:28px;border-radius:7px;background:var(--bar);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.plan b{font-size:14px}.plan p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.plan input{width:18px;height:18px;accent-color:var(--gold-deep);margin-top:5px}

/* Copilot */
aside{min-width:0}
.rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.ring{display:flex;gap:14px;align-items:center}
.ring svg{flex:none}
.ring b{font-size:15px}.ring p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ask{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.ask button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface-2)}
.ask button:hover,.ask button:focus-visible{border-color:var(--gold)}
.ask b{font-size:12.5px;display:block}.ask span{font-size:13px;color:var(--ink-2)}
.checks{list-style:none;padding:0;margin:8px 0 0;columns:1;font-size:12.5px}
.checks li{display:flex;gap:8px;padding:3px 0;color:var(--ink-2)}
.checks li.ok{color:var(--muted)}
.checks li i{font-style:normal;width:16px;flex:none;text-align:center;font-weight:800}
.checks li.ok i{color:var(--ok)}.checks li.no i{color:var(--mod)}
.ai-out{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto;margin-top:10px}
.chat{display:flex;gap:6px;margin-top:10px}
.chat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);z-index:9}

/* Data */
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.timeline li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.timeline li.done{border-color:var(--gold);background:var(--gold-tint)}
.timeline .n{font-size:12px;font-weight:700;color:var(--gold-ink)}
.timeline b{display:block;font-size:13.5px;margin:2px 0}
.timeline p{margin:0;font-size:12px;color:var(--ink-2)}
pre.json{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;max-height:420px;overflow:auto;margin:0}

/* Report sheet: a light paper document in both themes, by design */
.sheet{--surface:#ffffff;--surface-2:#faf7f0;--ink:#373535;--ink-2:#4b494b;--muted:#767575;--line:#e6e2da;--gold-ink:#8a6d0b;--gold-tint:#fbf3e4;
  --ok:#4f8f6f;--mild:#c39a16;--mod:#d9772b;--sev:#c2452f;--bone:#efe5cf;--bone-line:#8d8270;--cart:#7fb6c9;--syn:#f2d9a6;--muscle:#d9a698;--lig:#8b6f5a;
  --tx-none:#8f8a85;--tx-nsaid:#6d84ab;--tx-steroid:#b0588a;--tx-pt:#3f8a68;--tx-prp:#8466bd;--tx-ldrt:#de9c2e;--tx-stem:#3e9aa5;--tx-tka:#5b5757;
  color-scheme:light;background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(18px,4vw,44px);max-width:880px;width:100%;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = v => Math.round(v * 10) / 10;
const has = (e, k, v) => Array.isArray(e[k]) && e[k].includes(v);
const blank = v => v === '' || v == null || (Array.isArray(v) && v.length === 0);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch(_) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch(e) { toast('Select the text and copy it'); } ta.remove(); }
}

    const res = await sample(prompt, Object.assign({signal:aiCtl.signal, onText:({text}) => { aiText = text; const o = $('#ai-out'); if (o) o.textContent = text; }}, opts || {}));
    aiText = res.text; if (res.truncated) aiNote = 'The answer was cut short.';
    if (Array.isArray(prompt)) chat.push({role:'assistant', content:res.text});
  } catch (err) {
    aiText = err && err.text ? err.text : '';
    const c = err && err.code;
    aiNote = c === 'cancelled' ? 'Stopped.' : c === 'not_granted' ? 'Claude access was not allowed for this page.' : c === 'rate_limited' ? 'Too many requests. Wait a minute and try again.' : 'Claude could not answer. Try again.';
    if (c === 'not_granted') sample = null;
    if (Array.isArray(prompt)) chat.pop();
  }
  aiBusy = false; renderRail();
}
const RULES = 'You support clinicians at JointGlow, a physician-led clinic that treats knee arthritis, including with low-dose radiation therapy (LDRT). Use only the encounter data given. Never invent findings, test results or outcomes. Say what is missing. Keep answers short and plain. Do not give a final diagnosis; the physician decides. Encounter (de-identified JSON): ';

document.addEventListener('click', ev => {

  if (d.sel) { const k = d.sel; S.e[k] = String(S.e[k]) === d.v ? '' : d.v; b.parentNode.querySelectorAll('[data-sel]').forEach(x => x.setAttribute('aria-checked', String(S.e[k]) === x.dataset.v)); changed(); if (k === 'consent' && S.tab === 'P') render(true); return; }
  if (d.multi) { const k = d.multi, arr = S.e[k], i = arr.indexOf(d.v);
    if (i >= 0) arr.splice(i, 1); else { arr.push(d.v); const excl = {conditions:'None of these', tried:'Nothing yet', jlt:'None'}[k]; if (excl) { if (d.v === excl) S.e[k] = [excl]; else { const j = S.e[k].indexOf(excl); if (j >= 0) S.e[k].splice(j, 1); } } }
    b.parentNode.querySelectorAll('[data-multi]').forEach(x => x.setAttribute('aria-pressed', S.e[k].includes(x.dataset.v))); return changed(); }
  if (d.show) { const i = S.show.indexOf(d.show); if (i >= 0) S.show.splice(i, 1); else S.show.push(d.show); S.show.sort((p, q) => TX_ORDER.indexOf(p) - TX_ORDER.indexOf(q)); save(); return render(true); }
  if (d.delay != null) { S.delay = +d.delay; save(); return render(true); }
  if (d.act === 'copy-report') return copyText($('#sheet').innerText);
  if (d.act === 'copy-json') return copyText(JSON.stringify(deid(), null, 2));
  if (d.act === 'dl-report' || d.act === 'dl-json') {
    if (!downloads) return;
    const isR = d.act === 'dl-report', code = deid().record_id;
    downloads.save(isR ? {filename:'jointglow-report-' + code + '.html', data:reportFile()} : {filename:'jointglow-record-' + code + '.json', data:JSON.stringify(deid(), null, 2)})
      .then(() => toast('Saved')).catch(err => toast(err && err.code === 'declined' ? 'Download cancelled' : 'Download unavailable here'));
    return;
  }
  if (d.act === 'ai-stop') { if (aiCtl) aiCtl.abort(); return; }
  if (d.act === 'ai-summary') return askClaude(RULES + context() + '\n\nWrite a pre-consult summary for the radiation oncologist: 4–6 sentences covering the story (OPQRST), key exam and imaging findings, and the leading and alternative diagnoses. Then a short list titled "Still missing" and a short list titled "Consider". Plain text, no markdown headers.');
  if (d.act === 'ai-explain') return askClaude(RULES + context() + '\n\nExplain to the patient, at a 6th-grade reading level, what is likely going on in their knee using the four areas (lining and fluid, cartilage, bone, muscles/tendons/ligaments), and what their main options are. Warm, encouraging, no guarantees, under 180 words. Plain text.');
}, false);
document.addEventListener('change', ev => {

  if (el.dataset.plan) { const k = el.dataset.plan, i = S.planOff.indexOf(k); if (el.checked && i >= 0) S.planOff.splice(i, 1); if (!el.checked && i < 0) S.planOff.push(k); save(); return render(true); }

  chat.push({role:'user', content:q}); if (chat.length > 12) chat = chat.slice(-12);

});
